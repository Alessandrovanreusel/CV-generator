[project]
name = "cv-generator"
version = "0.1.0"
description = "CLI tool to generate tailored, ATS-optimized CVs from job ads using Claude AI"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyMuPDF>=1.24",
    "requests>=2.31",
    "langdetect>=1.0",
    "python-jobspy>=1.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "cv-generator[web]",
]

[project.scripts]
cv-generator = "src.main:main"
cv-web = "src.web.app:run_server"

[tool.pytest.ini_options]
markers = [
    "integration: full pipeline integration tests",
]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
